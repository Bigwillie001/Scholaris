<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teen Budget Bot</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header>
      <h1>Teen Budget Bot</h1>
      <p>Get simple advice on managing your money, tracking expenses, and saving smarter.</p>
    </header>

    <main>
      <section class="controls">
        <div class="input-group">
          <label for="message">Ask your finance question:</label>
          <textarea id="message" rows="3" placeholder="e.g. How do I track my allowance?" spellcheck="false"></textarea>
        </div>
        <button id="askButton">Ask the bot</button>
      </section>

      <section class="chat-panel">
        <div id="chatLog" class="chat-log"></div>
      </section>

      <section class="tools">
        <div class="tool-card">
          <h2>Budget builder</h2>
          <p>Enter your income and expenses to see where your money goes each week.</p>
        </div>
        <div class="tool-card">
          <h2>Savings plan</h2>
          <p>Set a goal, pick a target date, and learn how much to save.</p>
        </div>
      </section>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
